<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinLearn — Course & Materi Laporan Keuangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="materi">

  <!-- TOPBAR NAVBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="brand">
        <span>FinLearn</span>
        <span class="brand-badge">Akuntansi</span>
      </a>

      <!-- NAVBAR DIRECT ACCESS -->
      <nav class="navbar-nav">
        <a href="index.html" class="nav-link" id="navDashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="keuangan.html" class="nav-link" id="navKeuangan">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          <span class="nav-text">Laporan Keuangan</span>
        </a>
        <a href="materi.html" class="nav-link active" id="navMateri">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span class="nav-text">Course Materi</span>
        </a>
      </nav>
    </div>

    <div class="topbar-right">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Ganti Tema">
        <span id="themeIcon">☀️</span>
      </button>
    </div>
  </header>

  <!-- MATERI FULL PAGE -->
  <div class="materi-page-wrapper">
    <!-- LEFT SIDEBAR -->
    <aside class="materi-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Daftar Modul</span>
        <span class="module-counter" id="moduleCounter">7 Modul</span>
      </div>

      <nav class="sidebar-scrollable" id="moduleList">
        <!-- Modul items rendered by JS -->
      </nav>

      <div class="sidebar-footer">
        <!-- Tampilan Baca Font Control -->
        <div class="font-size-control">
          <span class="control-label">Tampilan Baca</span>
          <div class="font-size-btn-group">
            <button class="font-size-btn" onclick="setFontSize('small')">A</button>
            <button class="font-size-btn active" onclick="setFontSize('standard')">A</button>
            <button class="font-size-btn" onclick="setFontSize('large')">A+</button>
          </div>
        </div>

        <!-- Progres Belajar -->
        <div class="progress-widget">
          <div class="progress-header">
            <span class="control-label">Progres Belajar</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
          </div>
          <div style="font-size: 11px; color: var(--text-muted); text-align: right;" id="progressSummary">
            0 / 7 Modul
          </div>
        </div>
      </div>
    </aside>

    <!-- RIGHT MAIN CONTENT (FULL PAGE READER) -->
    <main class="materi-content-area" id="materiMain">
      <div class="course-breadcrumb">
        <span>Katalog Kursus</span>
        <span>/</span>
        <span style="color: var(--text)">Dasar Laporan Keuangan</span>
      </div>

      <header class="module-header">
        <span class="module-header-tag" id="currentModuleTag">MODUL 1</span>
        <h1 class="module-header-title" id="currentModuleTitle">Pengenalan Laporan Keuangan</h1>
      </header>

      <!-- ARTICLE READER -->
      <article class="article-reader text-standard" id="articleBody">
        <!-- Content will be injected here (parsed Markdown layout) -->
      </article>

      <!-- NAVIGATION PREV / NEXT -->
      <nav class="module-navigation">
        <button class="btn-nav-step" id="btnPrevMod" onclick="changeModule(-1)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Modul Sebelumnya
        </button>
        <button class="btn-nav-step" id="btnNextMod" onclick="changeModule(1)">
          Modul Selanjutnya
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </nav>
    </main>
  </div>

  <!-- FLOATING SCROLL TOP -->
  <button class="btn-floating-top" id="btnScrollTop" onclick="scrollToTop()" title="Kembali ke atas">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="materi_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
